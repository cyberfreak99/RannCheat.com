<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>@Chat - Telegram Style</title>
    <link rel="icon" href="https://cyberfreak99.github.io/RannCheat.com/deepseek_20260912_6a4fae.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --bg-page: #f0f0f3;
            --bg-card: #ffffff;
            --bg-black: #1a1a1a;
            --text-primary: #1a1a1a;
            --text-secondary: #888;
            --text-muted: #bbb;
            --border: #e5e5e5;
            --accent: #1a1a1a;
            --online: #4ade80;
            --unread: #e94560;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        .screen {
            display: none;
            height: 100vh;
            height: 100dvh;
            flex-direction: column;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }
        .screen.active { display: flex; }

        /* ========== AUTH ========== */
        #authScreen {
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: var(--bg-page);
        }

        .auth-card {
            width: 100%; height: 100%;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .auth-header {
            background: var(--bg-black);
            height: 200px;
            border-bottom-left-radius: 50% 40px;
            border-bottom-right-radius: 50% 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .auth-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.06) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.06) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.06) 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            opacity: 0.5;
        }

        .logo-box {
            width: 70px; height: 70px;
            background: white;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
            overflow: hidden;
        }

        .logo-box img { width: 100%; height: 100%; object-fit: cover; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .auth-body {
            flex: 1;
            padding: 25px 28px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .auth-title {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 0.82em;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.75em;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 0;
            border: none;
            border-bottom: 1.5px solid var(--border);
            background: transparent;
            color: var(--text-primary);
            font-size: 0.95em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-bottom-color: var(--accent);
        }

        .form-group input::placeholder { color: var(--text-muted); }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--bg-black);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: transform 0.15s, opacity 0.2s;
        }

        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; }

        .switch-link {
            text-align: center;
            margin-top: auto;
            padding-top: 20px;
            font-size: 0.82em;
            color: var(--text-secondary);
        }

        .switch-link a {
            color: var(--text-primary);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            margin-left: 4px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.82em;
            display: none;
        }

        .alert.show { display: block; }
        .alert-error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }

        .hidden { display: none !important; }

        /* ========== TELEGRAM CHAT LIST ========== */
        .tg-header {
            background: var(--bg-black);
            color: white;
            padding: 14px 18px;
            padding-top: calc(14px + env(safe-area-inset-top, 0px));
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .tg-header .title {
            font-size: 1.15em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tg-header .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1em;
            transition: background 0.2s;
        }

        .icon-btn:hover { background: rgba(255,255,255,0.2); }

        .tg-search {
            padding: 12px 18px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .tg-search-wrapper { position: relative; }

        .tg-search-wrapper .prefix {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-weight: bold;
        }

        .tg-search-wrapper input {
            width: 100%;
            padding: 11px 14px 11px 32px;
            background: var(--bg-page);
            border: none;
            border-radius: 22px;
            color: var(--text-primary);
            font-size: 0.92em;
            font-family: inherit;
        }

        .tg-search-wrapper input:focus { outline: none; background: #e8e8ec; }

        .tg-search-results {
            padding: 10px 18px;
            background: var(--bg-card);
            max-height: 300px;
            overflow-y: auto;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .tg-search-results:empty { display: none; }

        .tg-user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }

        .tg-user-item:last-child { border-bottom: none; }

        .tg-user-item .info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }

        .tg-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--bg-black);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            font-size: 1.1em;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .tg-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .tg-avatar .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 13px;
            height: 13px;
            background: var(--online);
            border-radius: 50%;
            border: 2px solid white;
        }

        .tg-user-item .name { font-weight: 600; font-size: 0.92em; }
        .tg-user-item .handle { color: var(--text-muted); font-size: 0.78em; margin-top: 2px; }

        .tg-chats {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
            background: var(--bg-card);
        }

        .tg-chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 11px 18px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid var(--border);
        }

        .tg-chat-item:hover { background: var(--bg-page); }

        .tg-chat-item .info { flex: 1; min-width: 0; }

        .tg-chat-item .row1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .tg-chat-item .name { font-weight: 600; font-size: 0.92em; }

        .tg-chat-item .time {
            color: var(--text-muted);
            font-size: 0.72em;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .tg-chat-item .row2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tg-chat-item .preview {
            color: var(--text-muted);
            font-size: 0.8em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .tg-chat-item .unread {
            background: var(--bg-black);
            color: white;
            font-size: 0.7em;
            font-weight: bold;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 6px;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .tg-empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .tg-empty .icon { font-size: 3.5em; margin-bottom: 16px; opacity: 0.4; }
        .tg-empty h3 { font-size: 1em; margin-bottom: 8px; color: var(--text-secondary); }
        .tg-empty p { font-size: 0.82em; }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85em;
        }

        /* ========== CONVERSATION ========== */
        .conv-header {
            background: var(--bg-black);
            color: white;
            padding: 10px 15px;
            padding-top: calc(10px + env(safe-area-inset-top, 0px));
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.4em;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        .conv-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            color: var(--bg-black);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1em;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        .conv-header .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .conv-header .info { flex: 1; min-width: 0; }
        .conv-header .name { font-weight: 700; font-size: 0.95em; }
        .conv-header .status { color: rgba(255,255,255,0.6); font-size: 0.75em; }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-page);
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 78%;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 0.92em;
            word-wrap: break-word;
            line-height: 1.4;
            animation: fadeIn 0.2s ease;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.mine {
            align-self: flex-end;
            background: var(--bg-black);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.theirs {
            align-self: flex-start;
            background: white;
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .message .time {
            display: inline-block;
            font-size: 0.65em;
            opacity: 0.6;
            margin-left: 6px;
            vertical-align: bottom;
        }

        .message .check {
            display: inline-block;
            font-size: 0.7em;
            margin-left: 3px;
            opacity: 0.8;
        }

        .message img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 4px;
            display: block;
        }

        /* ========== INPUT AREA ========== */
        .input-area {
            background: white;
            padding: 10px 12px;
            padding-bottom: calc(10px + var(--safe-bottom));
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 11px 16px;
            background: var(--bg-page);
            border: none;
            border-radius: 22px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
        }

        .input-area input:focus { outline: none; background: #e8e8ec; }

        .input-area .circle-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .input-area .circle-btn:hover { background: var(--bg-page); }

        .input-area .send-btn {
            background: var(--bg-black);
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.05em;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: transform 0.15s, opacity 0.2s;
        }

        .input-area .send-btn:active { transform: scale(0.92); }
        .input-area .send-btn:disabled { opacity: 0.4; }

        /* ========== PROFILE MODAL ========== */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }

        .modal.show { display: flex; }

        .modal-box {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            background: var(--bg-black);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 20px 20px 0 0;
            position: relative;
        }

        .modal-header h2 {
            font-size: 1.1em;
            font-weight: 700;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1em;
        }

        .profile-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--bg-black);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 2.5em;
            margin: -50px auto 15px;
            border: 5px solid white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }

        .profile-info {
            text-align: center;
            padding: 0 20px 20px;
        }

        .profile-name {
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-handle {
            color: var(--text-muted);
            font-size: 0.85em;
            margin-bottom: 12px;
        }

        .profile-bio {
            color: var(--text-secondary);
            font-size: 0.85em;
            line-height: 1.5;
            padding: 12px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            padding: 0 20px 20px;
        }

        .profile-btn {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .profile-btn.primary {
            background: var(--bg-black);
            color: white;
        }

        .profile-btn.secondary {
            background: var(--bg-page);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .profile-btn:active { opacity: 0.7; }

        .edit-field {
            padding: 0 20px 15px;
        }

        .edit-field label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.75em;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .edit-field input,
        .edit-field textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.9em;
            font-family: inherit;
            background: var(--bg-page);
            resize: none;
        }

        .edit-field input:focus,
        .edit-field textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* ========== EMOJI PICKER ========== */
        .emoji-picker {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid var(--border);
            padding: 15px;
            display: none;
            z-index: 90;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
            max-height: 40vh;
            overflow-y: auto;
        }

        .emoji-picker.show { display: block; }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
        }

        .emoji-grid button {
            background: transparent;
            border: none;
            font-size: 1.6em;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: background 0.15s;
        }

        .emoji-grid button:hover { background: var(--bg-page); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (min-width: 600px) {
            #authScreen { padding: 20px; }
            .auth-card {
                max-width: 420px;
                height: auto;
                min-height: 600px;
                max-height: 90vh;
                border-radius: 28px;
                box-shadow: 0 30px 80px rgba(0,0,0,0.15);
            }
        }
    </style>
</head>
<body>

<!-- ========== AUTH ========== -->
<div class="screen active" id="authScreen">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-box">
                <img src="https://cyberfreak99.github.io/RannCheat.com/deepseek_20260912_6a4fae.png" alt="Logo">
            </div>
        </div>

        <div class="auth-body">
            <div class="alert" id="authAlert"></div>

            <!-- LOGIN -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <h1 class="auth-title">Login</h1>
                <p class="auth-subtitle">Welcome back! Please login to continue</p>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="your@username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">Login</button>
                <div class="switch-link">
                    Don't have an account? <a onclick="switchTab('signup')">Sign Up</a>
                </div>
            </form>

            <!-- SIGNUP -->
            <form id="signupForm" class="hidden" onsubmit="handleSignup(event)">
                <h1 class="auth-title">Sign Up</h1>
                <p class="auth-subtitle">Create your account to get started</p>

                <div class="form-group">
                    <label>Username (@username)</label>
                    <input type="text" id="signupUsername" placeholder="username" required pattern="[a-z0-9_]{3,20}">
                </div>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="signupDisplayName" placeholder="Your Name" required maxlength="30">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                </div>

                <button type="submit" class="btn-primary" id="signupBtn">Sign Up</button>
                <div class="switch-link">
                    Already have an account? <a onclick="switchTab('login')">Login</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ========== CHAT LIST ========== -->
<div class="screen" id="listScreen">
    <div class="tg-header">
        <div class="title">💬 @Chat</div>
        <div class="actions">
            <button class="icon-btn" onclick="openMyProfile()" title="Profile">👤</button>
            <button class="icon-btn" onclick="handleLogout()" title="Logout">⏻</button>
        </div>
    </div>

    <div class="tg-search">
        <div class="tg-search-wrapper">
            <span class="prefix">🔍</span>
            <input type="text" id="searchInput" placeholder="Search @username..." autocomplete="off">
        </div>
    </div>

    <div class="tg-search-results" id="searchResults"></div>

    <div class="tg-chats" id="chatsList">
        <div class="loading">Loading chats...</div>
    </div>
</div>

<!-- ========== CONVERSATION ========== -->
<div class="screen" id="convScreen">
    <div class="conv-header" onclick="openChatProfile()">
        <button class="back-btn" onclick="event.stopPropagation(); backToList()">←</button>
        <div class="avatar" id="convAvatar">?</div>
        <div class="info">
            <div class="name" id="convName">Loading...</div>
            <div class="status" id="convStatus">@...</div>
        </div>
    </div>

    <div class="messages" id="messagesBox"></div>

    <div class="emoji-picker" id="emojiPicker">
        <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="input-area">
        <button class="circle-btn" onclick="toggleEmoji()" title="Emoji">😊</button>
        <input type="text" id="messageInput" placeholder="Message..." autocomplete="off">
        <button class="send-btn" id="sendBtn" disabled>➤</button>
    </div>
</div>

<!-- ========== PROFILE MODAL ========== -->
<div class="modal" id="profileModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="modalTitle">Profile</h2>
            <button class="modal-close" onclick="closeProfile()">✕</button>
        </div>

        <div class="profile-avatar-large" id="profileAvatarLarge" onclick="pickAvatar()">?</div>

        <div class="profile-info" id="profileView">
            <div class="profile-name" id="profileName">-</div>
            <div class="profile-handle" id="profileHandle">@-</div>
            <div class="profile-bio" id="profileBio">No bio yet</div>
            <div class="profile-actions" id="profileActions"></div>
        </div>

        <div id="profileEdit" class="hidden">
            <div class="edit-field">
                <label>Display Name</label>
                <input type="text" id="editDisplayName" maxlength="30">
            </div>
            <div class="edit-field">
                <label>Bio</label>
                <textarea id="editBio" rows="3" maxlength="150" placeholder="Tell us about yourself..."></textarea>
            </div>
            <div class="edit-field" style="display:flex; gap:10px;">
                <button class="profile-btn secondary" onclick="cancelEdit()" style="flex:1;">Cancel</button>
                <button class="profile-btn primary" onclick="saveProfile()" style="flex:1;">Save</button>
            </div>
        </div>
    </div>
</div>

<input type="file" id="avatarInput" accept="image/*" style="display:none">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, serverTimestamp, onSnapshot, orderBy, updateDoc, limit, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBJIquWKVAIZphH88FhUfDpwziZKvwOBlo",
        authDomain: "ranncheats.firebaseapp.com",
        projectId: "ranncheats",
        storageBucket: "ranncheats.firebasestorage.app",
        messagingSenderId: "814435055152",
        appId: "1:814435055152:web:cf47668c4992929bc3dff5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentUserData = null;
    let activeChatId = null;
    let activeOtherUid = null;
    let activeOtherData = null;
    let messagesUnsubscribe = null;
    let chatsUnsubscribe = null;
    let searchTimeout = null;
    let isEditingProfile = false;
    let editingSelf = false;

    const EMOJIS = ['😀','😂','🥰','😎','🤔','😭','😡','🥳','👍','👎','❤️','🔥','✨','🎉','💯','🙏','👏','🤝','💪','🎮','⚡','🌟','💎','🏆','🚀','🎯','🎨','🎵','📷','💬','✅','❌','⏰','📍','🔔','💡','🗿','🍕','☕','🌈'];

    window.showScreen = function(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    window.switchTab = function(tab) {
        const lf = document.getElementById('loginForm');
        const sf = document.getElementById('signupForm');
        if (tab === 'login') { lf.classList.remove('hidden'); sf.classList.add('hidden'); }
        else { lf.classList.add('hidden'); sf.classList.remove('hidden'); }
        document.getElementById('authAlert').classList.remove('show');
    };

    function showAuthAlert(msg, type = 'error') {
        const box = document.getElementById('authAlert');
        box.textContent = msg;
        box.className = 'alert alert-' + type + ' show';
        setTimeout(() => box.classList.remove('show'), 4000);
    }

    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function initialOf(n) { return (n || '?').charAt(0).toUpperCase(); }

    function timeAgo(timestamp) {
        if (!timestamp) return '';
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        const diff = (Date.now() - date.getTime()) / 1000;
        if (diff < 60) return 'now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h';
        if (diff < 604800) return Math.floor(diff / 86400) + 'd';
        return date.toLocaleDateString();
    }

    // ========== SIGNUP ==========
    window.handleSignup = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('signupBtn');
        const username = document.getElementById('signupUsername').value.trim().toLowerCase();
        const displayName = document.getElementById('signupDisplayName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;

        if (!/^[a-z0-9_]{3,20}$/.test(username)) {
            showAuthAlert('Username: 3-20 chars, only a-z, 0-9, _');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Creating...';

        try {
            const usersRef = collection(db, 'users');
            const q = query(usersRef, where('username', '==', username));
            const snapshot = await getDocs(q);
            if (!snapshot.empty) throw new Error('Username already taken!');

            const cred = await createUserWithEmailAndPassword(auth, email, password);
            const uid = cred.user.uid;

            await setDoc(doc(db, 'users', uid), {
                uid: uid,
                username: username,
                displayName: displayName,
                email: email,
                bio: '',
                photoURL: '',
                lastSeen: serverTimestamp(),
                createdAt: serverTimestamp()
            });
        } catch (err) {
            let msg = err.message;
            if (msg.includes('email-already-in-use')) msg = 'Email already registered!';
            if (msg.includes('invalid-email')) msg = 'Invalid email!';
            if (msg.includes('weak-password')) msg = 'Password too weak!';
            showAuthAlert(msg);
            btn.disabled = false;
            btn.textContent = 'Sign Up';
        }
    };

    // ========== LOGIN ==========
    window.handleLogin = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const username = document.getElementById('loginUsername').value.trim().toLowerCase();
        const password = document.getElementById('loginPassword').value;

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Logging in...';

        try {
            const usersRef = collection(db, 'users');
            const q = query(usersRef, where('username', '==', username), limit(1));
            const snapshot = await getDocs(q);
            if (snapshot.empty) throw new Error('Username not found!');

            const email = snapshot.docs[0].data().email;
            await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
            let msg = err.message;
            if (msg.includes('invalid-credential') || msg.includes('wrong-password')) msg = 'Wrong password!';
            showAuthAlert(msg);
            btn.disabled = false;
            btn.textContent = 'Login';
        }
    };

    window.handleLogout = async function() {
        if (currentUser) {
            try { await updateDoc(doc(db, 'users', currentUser.uid), { lastSeen: serverTimestamp() }); } catch(e){}
        }
        if (messagesUnsubscribe) messagesUnsubscribe();
        if (chatsUnsubscribe) chatsUnsubscribe();
        await signOut(auth);
    };

    // ========== AUTH STATE ==========
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            currentUser = null; currentUserData = null;
            showScreen('authScreen');
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').textContent = 'Login';
            document.getElementById('signupBtn').disabled = false;
            document.getElementById('signupBtn').textContent = 'Sign Up';
            switchTab('login');
            return;
        }
        currentUser = user;
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (userDoc.exists()) currentUserData = userDoc.data();

        // Update lastSeen
        try { await updateDoc(doc(db, 'users', user.uid), { lastSeen: serverTimestamp() }); } catch(e){}

        showScreen('listScreen');
        loadChats();
    });

    // ========== SEARCH ==========
    document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        const term = e.target.value.trim().toLowerCase();
        const resultsBox = document.getElementById('searchResults');
        if (term.length < 1) { resultsBox.innerHTML = ''; return; }
        searchTimeout = setTimeout(() => searchUsers(term), 350);
    });

    async function searchUsers(term) {
        const resultsBox = document.getElementById('searchResults');
        resultsBox.innerHTML = '<div class="loading">Searching...</div>';
        try {
            const usersRef = collection(db, 'users');
            const q = query(usersRef, where('username', '>=', term), where('username', '<=', term + '\uf8ff'), limit(20));
            const snapshot = await getDocs(q);
            const results = [];
            snapshot.forEach((d) => {
                const data = d.data();
                if (data.uid !== currentUser.uid) results.push(data);
            });
            if (results.length === 0) { resultsBox.innerHTML = '<div class="loading">No users found</div>'; return; }
            resultsBox.innerHTML = results.map(u => `
                <div class="tg-user-item" onclick="startChat('${u.uid}', '${escapeHtml(u.username)}', '${escapeHtml(u.displayName)}')">
                    <div class="info">
                        <div class="tg-avatar">
                            ${u.photoURL ? `<img src="${u.photoURL}" alt="">` : initialOf(u.displayName)}
                        </div>
                        <div>
                            <div class="name">${escapeHtml(u.displayName)}</div>
                            <div class="handle">@${escapeHtml(u.username)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            console.error(err);
            resultsBox.innerHTML = '<div class="loading">Error</div>';
        }
    }

    // ========== START CHAT ==========
    window.startChat = async function(otherUid, otherUsername, otherDisplayName) {
        const chatId = [currentUser.uid, otherUid].sort().join('_');
        const chatDoc = await getDoc(doc(db, 'chats', chatId));
        if (!chatDoc.exists()) {
            await setDoc(doc(db, 'chats', chatId), {
                participants: [currentUser.uid, otherUid],
                participantInfo: {
                    [currentUser.uid]: { username: currentUserData.username, displayName: currentUserData.displayName, photoURL: currentUserData.photoURL || '' },
                    [otherUid]: { username: otherUsername, displayName: otherDisplayName, photoURL: '' }
                },
                lastMessage: '',
                lastMessageAt: serverTimestamp(),
                lastSenderId: '',
                unread: { [currentUser.uid]: 0, [otherUid]: 0 }
            });
        }
        document.getElementById('searchInput').value = '';
        document.getElementById('searchResults').innerHTML = '';
        openConversation(chatId, otherUid);
    };

    // ========== LOAD CHATS ==========
    function loadChats() {
        if (chatsUnsubscribe) chatsUnsubscribe();
        const chatsList = document.getElementById('chatsList');
        const chatsRef = collection(db, 'chats');
        const q = query(chatsRef, where('participants', 'array-contains', currentUser.uid));
        chatsUnsubscribe = onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                chatsList.innerHTML = `<div class="tg-empty"><div class="icon">💬</div><h3>No chats yet</h3><p>Search a @username above to start chatting</p></div>`;
                return;
            }
            const chats = [];
            snapshot.forEach((d) => chats.push({ id: d.id, ...d.data() }));
            chats.sort((a, b) => (b.lastMessageAt?.toMillis?.() || 0) - (a.lastMessageAt?.toMillis?.() || 0));

            chatsList.innerHTML = chats.map(chat => {
                const otherUid = chat.participants.find(uid => uid !== currentUser.uid);
                const info = chat.participantInfo?.[otherUid] || { username: 'unknown', displayName: 'Unknown', photoURL: '' };
                const preview = chat.lastMessage ? escapeHtml(chat.lastMessage) : 'No messages yet';
                const unread = chat.unread?.[currentUser.uid] || 0;
                const isMine = chat.lastSenderId === currentUser.uid;
                const prefix = isMine && chat.lastMessage ? '✓ ' : '';

                return `
                    <div class="tg-chat-item" onclick="openConversation('${chat.id}', '${otherUid}')">
                        <div class="tg-avatar">
                            ${info.photoURL ? `<img src="${info.photoURL}" alt="">` : initialOf(info.displayName)}
                        </div>
                        <div class="info">
                            <div class="row1">
                                <div class="name">${escapeHtml(info.displayName)}</div>
                                <div class="time">${timeAgo(chat.lastMessageAt)}</div>
                            </div>
                            <div class="row2">
                                <div class="preview">${prefix}${preview}</div>
                                ${unread > 0 ? `<div class="unread">${unread}</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        });
    }

    // ========== OPEN CONVERSATION ==========
    window.openConversation = async function(chatId, otherUid) {
        activeChatId = chatId;
        activeOtherUid = otherUid;
        showScreen('convScreen');
        document.getElementById('messagesBox').innerHTML = '';
        document.getElementById('emojiPicker').classList.remove('show');

        const otherDoc = await getDoc(doc(db, 'users', otherUid));
        if (otherDoc.exists()) {
            activeOtherData = otherDoc.data();
            document.getElementById('convName').textContent = activeOtherData.displayName;
            document.getElementById('convAvatar').innerHTML = activeOtherData.photoURL
                ? `<img src="${activeOtherData.photoURL}" alt="">`
                : initialOf(activeOtherData.displayName);

            // Listen to other user for online status
            onSnapshot(doc(db, 'users', otherUid), (docSnap) => {
                if (docSnap.exists()) {
                    const d = docSnap.data();
                    const lastSeen = d.lastSeen?.toDate?.();
                    let statusText = '@' + d.username;
                    if (lastSeen) {
                        const diff = (Date.now() - lastSeen.getTime()) / 1000;
                        statusText = diff < 120 ? 'online' : 'last seen ' + timeAgo(d.lastSeen);
                    }
                    document.getElementById('convStatus').textContent = statusText;
                }
            });
        }

        // Mark as read
        try {
            await updateDoc(doc(db, 'chats', chatId), { [`unread.${currentUser.uid}`]: 0 });
        } catch(e){}

        // Load messages
        if (messagesUnsubscribe) messagesUnsubscribe();
        const messagesRef = collection(db, 'chats', chatId, 'messages');
        const q = query(messagesRef, orderBy('createdAt', 'asc'));
        messagesUnsubscribe = onSnapshot(q, (snapshot) => {
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';
            snapshot.forEach((d) => {
                const msg = d.data();
                const isMine = msg.senderId === currentUser.uid;
                const div = document.createElement('div');
                div.className = 'message ' + (isMine ? 'mine' : 'theirs');
                const time = msg.createdAt?.toDate?.() || new Date();
                const timeStr = time.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                const check = isMine ? '<span class="check">✓✓</span>' : '';
                div.innerHTML = `${escapeHtml(msg.text)}<span class="time">${timeStr}${check}</span>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    };

    window.backToList = function() {
        if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
        activeChatId = null; activeOtherUid = null; activeOtherData = null;
        document.getElementById('messagesBox').innerHTML = '';
        document.getElementById('emojiPicker').classList.remove('show');
        showScreen('listScreen');
    };

    // ========== SEND MESSAGE ==========
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    messageInput.addEventListener('input', () => { sendBtn.disabled = !messageInput.value.trim(); });
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && messageInput.value.trim()) sendMessage(); });
    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !activeChatId) return;
        messageInput.value = '';
        sendBtn.disabled = true;

        try {
            await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
                senderId: currentUser.uid, text: text, createdAt: serverTimestamp()
            });

            const chatRef = doc(db, 'chats', activeChatId);
            const chatDoc = await getDoc(chatRef);
            const unread = chatDoc.data()?.unread || {};
            unread[activeOtherUid] = (unread[activeOtherUid] || 0) + 1;

            await updateDoc(chatRef, {
                lastMessage: text,
                lastMessageAt: serverTimestamp(),
                lastSenderId: currentUser.uid,
                unread: unread
            });
        } catch (err) {
            console.error(err);
            alert('Failed: ' + err.message);
        }
    }

    // ========== EMOJI ==========
    const emojiGrid = document.getElementById('emojiGrid');
    emojiGrid.innerHTML = EMOJIS.map(e => `<button type="button" onclick="insertEmoji('${e}')">${e}</button>`).join('');

    window.toggleEmoji = function() {
        document.getElementById('emojiPicker').classList.toggle('show');
    };

    window.insertEmoji = function(emoji) {
        messageInput.value += emoji;
        sendBtn.disabled = !messageInput.value.trim();
        messageInput.focus();
    };

    // ========== PROFILE ==========
    window.openMyProfile = function() {
        editingSelf = true;
        isEditingProfile = false;
        document.getElementById('modalTitle').textContent = 'My Profile';
        document.getElementById('profileName').textContent = currentUserData.displayName;
        document.getElementById('profileHandle').textContent = '@' + currentUserData.username;
        document.getElementById('profileBio').textContent = currentUserData.bio || 'No bio yet';
        document.getElementById('profileAvatarLarge').innerHTML = currentUserData.photoURL
            ? `<img src="${currentUserData.photoURL}" alt="">`
            : initialOf(currentUserData.displayName);

        document.getElementById('profileView').classList.remove('hidden');
        document.getElementById('profileEdit').classList.add('hidden');
        document.getElementById('profileActions').innerHTML = `
            <button class="profile-btn primary" onclick="editProfile()" style="flex:1;">Edit Profile</button>
        `;
        document.getElementById('profileModal').classList.add('show');
    };

    window.openChatProfile = function() {
        if (!activeOtherData) return;
        editingSelf = false;
        isEditingProfile = false;
        document.getElementById('modalTitle').textContent = 'Profile';
        document.getElementById('profileName').textContent = activeOtherData.displayName;
        document.getElementById('profileHandle').textContent = '@' + activeOtherData.username;
        document.getElementById('profileBio').textContent = activeOtherData.bio || 'No bio yet';
        document.getElementById('profileAvatarLarge').innerHTML = activeOtherData.photoURL
            ? `<img src="${activeOtherData.photoURL}" alt="">`
            : initialOf(activeOtherData.displayName);

        document.getElementById('profileView').classList.remove('hidden');
        document.getElementById('profileEdit').classList.add('hidden');
        document.getElementById('profileActions').innerHTML = '';
        document.getElementById('profileModal').classList.add('show');
    };

    window.editProfile = function() {
        isEditingProfile = true;
        document.getElementById('editDisplayName').value = currentUserData.displayName;
        document.getElementById('editBio').value = currentUserData.bio || '';
        document.getElementById('profileView').classList.add('hidden');
        document.getElementById('profileEdit').classList.remove('hidden');
    };

    window.cancelEdit = function() {
        isEditingProfile = false;
        document.getElementById('profileView').classList.remove('hidden');
        document.getElementById('profileEdit').classList.add('hidden');
    };

    window.saveProfile = async function() {
        const newName = document.getElementById('editDisplayName').value.trim();
        const newBio = document.getElementById('editBio').value.trim();
        if (!newName) { alert('Name required'); return; }

        try {
            await updateDoc(doc(db, 'users', currentUser.uid), {
                displayName: newName,
                bio: newBio
            });
            currentUserData.displayName = newName;
            currentUserData.bio = newBio;
            document.getElementById('profileName').textContent = newName;
            document.getElementById('profileBio').textContent = newBio || 'No bio yet';
            document.getElementById('profileView').classList.remove('hidden');
            document.getElementById('profileEdit').classList.add('hidden');
            isEditingProfile = false;
        } catch (err) { alert('Failed: ' + err.message); }
    };

    window.pickAvatar = function() {
        if (!editingSelf) return;
        document.getElementById('avatarInput').click();
    };

    document.getElementById('avatarInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 500000) { alert('Image must be under 500KB'); return; }

        const reader = new FileReader();
        reader.onload = async (ev) => {
            const base64 = ev.target.result;
            try {
                await updateDoc(doc(db, 'users', currentUser.uid), { photoURL: base64 });
                currentUserData.photoURL = base64;
                document.getElementById('profileAvatarLarge').innerHTML = `<img src="${base64}" alt="">`;

                // Update chats' participantInfo
                const chatsRef = collection(db, 'chats');
                const q = query(chatsRef, where('participants', 'array-contains', currentUser.uid));
                const snap = await getDocs(q);
                snap.forEach(async (chatDoc) => {
                    const data = chatDoc.data();
                    const updates = {};
                    updates[`participantInfo.${currentUser.uid}.photoURL`] = base64;
                    updates[`participantInfo.${currentUser.uid}.displayName`] = currentUserData.displayName;
                    await updateDoc(doc(db, 'chats', chatDoc.id), updates);
                });
            } catch (err) { alert('Failed: ' + err.message); }
        };
        reader.readAsDataURL(file);
    });

    window.closeProfile = function() {
        document.getElementById('profileModal').classList.remove('show');
        isEditingProfile = false;
        editingSelf = false;
    };

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') e.preventDefault();
    });

    // Close emoji on outside click
    document.addEventListener('click', (e) => {
        const picker = document.getElementById('emojiPicker');
        if (picker.classList.contains('show') && !picker.contains(e.target) && !e.target.closest('.circle-btn')) {
            picker.classList.remove('show');
        }
    });
</script>

</body>
</html>
